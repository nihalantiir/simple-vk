name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          optional_components: com.lunarg.vulkan.volk,com.lunarg.vulkan.vma,com.lunarg.vulkan.glm
          cache: true

      - name: DEBUG list SDK contents
        shell: bash
        run: find "$VULKAN_SDK" -maxdepth 6 \( -iname "*sdl*" -o -iname "*volk*" -o -iname "*vma*" -o -iname "glm*" \) 2>&1 | head -100

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Compile-only: no GPU is available on hosted runners, so this
      # verifies the project configures and builds, not that it runs.
      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug
