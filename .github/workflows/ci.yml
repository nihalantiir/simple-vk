name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          optional_components: com.lunarg.vulkan.sdl2,com.lunarg.vulkan.volk,com.lunarg.vulkan.vma,com.lunarg.vulkan.glm
          cache: true

      # The Vulkan SDK does not reliably offer SDL3/GLM as installable
      # components in unattended CI installs (unlike the interactive
      # Windows installer, which bundles SDL3 unconditionally) - vcpkg,
      # preinstalled on GitHub-hosted runners, fills that gap for CI.
      # volk/VMA still come from the Vulkan SDK, matching local
      # development. sdl3[core] skips SDL3's optional Linux backends
      # (wayland/x11/ibus/dbus), which pull in build tools (gperf,
      # autoconf) this runner doesn't have and which a compile-only check
      # doesn't need anyway.
      #
      # The install prefix is captured into SIMPLE_VK_VCPKG_PREFIX (not
      # VCPKG_ROOT) because ilammy/msvc-dev-cmd, which runs after this
      # step on Windows, overwrites VCPKG_ROOT with Visual Studio's own
      # bundled (and here, unused) vcpkg instance.
      - name: Install SDL3 + GLM (vcpkg)
        shell: bash
        run: |
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
          "$VCPKG_ROOT/vcpkg" install "sdl3[core]" glm

          TRIPLET=x64-windows
          [ "$RUNNER_OS" = "Linux" ] && TRIPLET=x64-linux
          echo "SIMPLE_VK_VCPKG_PREFIX=$VCPKG_ROOT/installed/$TRIPLET" >> "$GITHUB_ENV"

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Compile-only: no GPU is available on hosted runners, so this
      # verifies the project configures and builds, not that it runs.
      - name: Configure
        shell: bash
        run: cmake --preset debug -DCMAKE_PREFIX_PATH="$SIMPLE_VK_VCPKG_PREFIX"

      - name: Build
        run: cmake --build --preset debug
