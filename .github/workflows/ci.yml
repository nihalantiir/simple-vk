name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          optional_components: com.lunarg.vulkan.volk,com.lunarg.vulkan.vma,com.lunarg.vulkan.glm
          cache: true

      - name: DEBUG list SDK contents
        shell: bash
        run: find "$VULKAN_SDK" -maxdepth 6 \( -iname "*sdl*" -o -iname "volk*" -o -iname "vk_mem_alloc.h" -o -iname "VulkanMemoryAllocator*" -o -iname "glm" -o -iname "glm.hpp" \) 2>&1 | head -100

      # The Vulkan SDK does not offer SDL3 as an installable component on
      # every platform (unlike the interactive Windows installer, which
      # bundles it unconditionally) - vcpkg, preinstalled on GitHub-hosted
      # runners, fills that one gap for CI only. volk/VMA/GLM still come
      # from the Vulkan SDK, matching local development.
      - name: Install SDL3 (vcpkg)
        shell: bash
        run: |
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" install sdl3

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Compile-only: no GPU is available on hosted runners, so this
      # verifies the project configures and builds, not that it runs.
      - name: Configure
        shell: bash
        run: |
          TRIPLET=x64-windows
          [ "$RUNNER_OS" = "Linux" ] && TRIPLET=x64-linux
          cmake --preset debug -DCMAKE_PREFIX_PATH="$VCPKG_ROOT/installed/$TRIPLET"

      - name: Build
        run: cmake --build --preset debug
