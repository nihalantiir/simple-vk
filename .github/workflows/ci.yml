name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          optional_components: com.lunarg.vulkan.sdl2,com.lunarg.vulkan.volk,com.lunarg.vulkan.vma,com.lunarg.vulkan.glm
          cache: true

      - name: DEBUG list SDK contents
        shell: bash
        run: find "$VULKAN_SDK" -maxdepth 6 \( -iname "*sdl*" -o -iname "volk*" -o -iname "vk_mem_alloc.h" -o -iname "VulkanMemoryAllocator*" -o -iname "glm" -o -iname "glm.hpp" \) 2>&1 | head -100

      # The Vulkan SDK does not reliably offer SDL3 as an installable
      # component in unattended CI installs (unlike the interactive Windows
      # installer, which bundles it unconditionally) - vcpkg, preinstalled
      # on GitHub-hosted runners, fills that gap for CI. volk/VMA/GLM still
      # come from the Vulkan SDK, matching local development. [core] skips
      # SDL3's optional Linux backends (wayland/x11/ibus/dbus), which pull
      # in build tools (gperf, autoconf) this runner doesn't have and which
      # a compile-only check doesn't need anyway.
      - name: Install SDL3 (vcpkg)
        shell: bash
        run: |
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" install "sdl3[core]"
          echo "--- installed tree ---"
          find "$VCPKG_ROOT/installed" -iname "SDL3Config.cmake"

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Compile-only: no GPU is available on hosted runners, so this
      # verifies the project configures and builds, not that it runs.
      - name: Configure
        shell: bash
        run: |
          TRIPLET=x64-windows
          [ "$RUNNER_OS" = "Linux" ] && TRIPLET=x64-linux
          SDL3_PREFIX="$VCPKG_ROOT/installed/$TRIPLET"
          echo "VCPKG_ROOT=$VCPKG_ROOT"
          echo "SDL3_PREFIX=$SDL3_PREFIX"
          find "$SDL3_PREFIX" -iname "SDL3Config.cmake" 2>&1 || true
          cmake --preset debug -DCMAKE_PREFIX_PATH="$SDL3_PREFIX"

      - name: Build
        run: cmake --build --preset debug
